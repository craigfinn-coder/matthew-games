<title>Matthew Finn's Puzzle Time</title>
<style>
:root{
  --sky:#8AD8FF; --dots:rgba(255,255,255,.4);
  --sun:#FFD23F; --tomato:#FF5A4E; --grass:#26B36B; --grape:#7B5CFF; --blue:#3A8DFF;
  --ink:#1D2B53; --paper:#FFFFFF; --mat:#EAF7FF;
  --font:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sky:#24407A; --dots:rgba(255,255,255,.12); }
}
:root[data-theme="dark"]{ --sky:#24407A; --dots:rgba(255,255,255,.12); }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;margin:0;font-family:var(--font);color:var(--ink);
  background:var(--sky);
  background-image:radial-gradient(var(--dots) 2px,transparent 2.6px);
  background-size:28px 28px;
  overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:4px solid var(--grape);outline-offset:4px}
#app{height:100%;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.screen[hidden],.modal[hidden],.win[hidden],[hidden]{display:none !important}

/* ---------- start ---------- */
#start{overflow-y:auto;padding:0 16px}
.start-inner{margin:auto;width:min(560px,100%);display:flex;flex-direction:column;gap:16px;padding:24px 0 32px}
.title{margin:0;text-align:center;font-weight:800;font-size:clamp(52px,12vw,100px);line-height:.95}
.title .word{display:inline-block;white-space:nowrap;margin:0 .12em}
.outline span,.title span span{
  display:inline-block;color:var(--c);transform:rotate(var(--r,0deg));
  text-shadow:-3px 0 var(--ink),3px 0 var(--ink),0 -3px var(--ink),0 3px var(--ink),
    -2px -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),0 8px 0 var(--ink);
}
.hello{margin:0;text-align:center;font-size:clamp(22px,5vw,30px);font-weight:800;color:var(--paper);
  text-shadow:0 3px 0 var(--ink)}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:16px}
.step{margin:0 0 10px;font-size:22px;font-weight:800}
.picker{display:block;position:relative;border:4px dashed var(--ink);border-radius:22px;background:var(--mat);
  aspect-ratio:var(--ar,4/3);max-height:40vh;width:100%;overflow:hidden;cursor:pointer;margin:0 auto}
.picker.port{width:auto;max-width:100%;height:min(40vh,420px);max-height:none}
.shapes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shape .ic{display:block;border:4px solid var(--ink);border-radius:6px;background:var(--paper);margin:8px 0 6px}
.shape .w{font-size:20px}
.recent{margin-top:14px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:10px 4px 6px}
.pthumb{aspect-ratio:4/3;width:100%;border:4px solid var(--ink);border-radius:14px;padding:0;background:var(--mat) center/cover no-repeat;box-shadow:0 4px 0 var(--ink)}
.pthumb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pthumb.on{outline:4px solid var(--grass);outline-offset:3px}
.recent-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.recent-head .step{margin:0;font-size:19px}
.chip.tidy{background:var(--paper);font-size:15px;padding:2px 12px;box-shadow:0 3px 0 var(--ink)}
.chip.tidy[aria-pressed="true"]{background:var(--tomato);color:var(--paper)}
.thumbs{display:flex;gap:12px;overflow-x:auto;padding:14px 6px 12px}
.thumb{position:relative;flex:none;width:78px;height:78px;border:4px solid var(--ink);border-radius:16px;padding:0;
  background:var(--mat) center/cover no-repeat;box-shadow:0 4px 0 var(--ink)}
.thumb .use{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;border-radius:12px;padding:0}
.thumb.add{display:grid;place-items:center;background:var(--sun);cursor:pointer;font-size:40px;font-weight:800;line-height:1}
.thumb.add input{position:absolute;opacity:0;width:1px;height:1px}
.myhint{margin:0;font-size:16px;font-weight:600}
.thumb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.thumb.on{outline:4px solid var(--grass);outline-offset:3px}
.thumb .x,.thumb .k{position:absolute;top:-12px;width:32px;height:32px;border-radius:50%;border:3px solid var(--ink);
  display:none;place-items:center;font-weight:800;font-size:15px;line-height:1;padding:0}
.thumb .x{right:-12px;background:var(--tomato);color:#fff}
.thumb .k{left:-12px;background:var(--paper);color:var(--ink);font-size:17px}
.thumb .k.kept{background:var(--sun)}
.thumbs.tidy .thumb .x,.thumbs.tidy .thumb .k{display:grid}
.thumbs.tidy .thumb:not(.add){animation:wiggle .35s ease-in-out infinite alternate}
@keyframes wiggle{from{rotate:-2deg}to{rotate:2deg}}
.resume{background:var(--grass)}
.resume-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.resume .rthumb{flex:none;width:84px;height:84px;border:4px solid var(--ink);border-radius:16px;background:var(--mat) center/cover no-repeat}
.resume .step{margin:0;color:var(--paper);text-shadow:0 2px 0 var(--ink);font-size:26px;line-height:1.1}
.resume .sub{margin:2px 0 0;font-weight:800;font-size:19px;color:var(--ink)}
.resume .row2{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.resume .big{background:var(--sun);color:var(--ink);text-shadow:none;flex:1}
.piece.hint{animation:hint .55s ease-in-out 6 alternate}
@keyframes hint{from{scale:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
  to{scale:1.15;filter:drop-shadow(0 0 10px #FFD23F) drop-shadow(0 0 5px #FFD23F)}}
.near{position:absolute;left:0;top:0;z-index:3;pointer-events:none}
.spot{position:absolute;left:0;top:0;z-index:3;pointer-events:none;animation:blink .6s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.3}to{opacity:1}}
@media (max-width:520px){.track{display:none}.bar{gap:7px;padding:8px}.ibtn{width:52px;height:52px}}
.picker input{position:absolute;opacity:0;width:1px;height:1px}
.picker img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.picker.has-img{border-style:solid}
.picker.has-img img{display:block}
.picker .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:12px}
.picker.has-img .ph{display:none}
.ph .cam{font-size:64px;line-height:1}
.ph b{font-size:26px}
.picker .change{position:absolute;right:10px;bottom:10px;display:none;background:var(--paper);border:3px solid var(--ink);
  border-radius:14px;padding:2px 12px;font-weight:800;font-size:17px}
.picker.has-img .change{display:block}
.alt{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.chip{border:3px solid var(--ink);background:var(--sun);border-radius:16px;padding:6px 14px;font-weight:800;font-size:17px;box-shadow:0 4px 0 var(--ink)}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.count{position:relative;border:4px solid var(--ink);border-radius:20px;background:var(--bg);box-shadow:0 7px 0 var(--ink);
  padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;transition:transform .1s,box-shadow .1s}
.count .n{font-size:clamp(40px,10vw,54px);font-weight:800;line-height:1;color:var(--paper);
  text-shadow:-2px 0 var(--ink),2px 0 var(--ink),0 -2px var(--ink),0 3px var(--ink)}
.count .w{font-size:16px;font-weight:800;line-height:1.1}
.count[aria-pressed="true"]{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.count[aria-pressed="true"]::after{content:"★";position:absolute;top:-16px;right:-12px;width:38px;height:38px;border-radius:50%;
  background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center;font-size:22px;color:var(--sun);
  text-shadow:0 0 1px var(--ink),0 0 1px var(--ink)}
.big{border:4px solid var(--ink);border-radius:24px;background:var(--tomato);color:var(--paper);font-weight:800;
  font-size:clamp(30px,7vw,40px);padding:10px 20px;box-shadow:0 8px 0 var(--ink);
  text-shadow:0 3px 0 var(--ink)}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.big:disabled{background:#B9C4D6;cursor:not-allowed;transform:none;box-shadow:0 8px 0 var(--ink)}
.big.green{background:var(--grass)}
.big.blue{background:var(--blue)}
.err{margin:0;background:var(--paper);border:3px solid var(--tomato);border-radius:16px;padding:8px 14px;font-weight:600;font-size:18px}

/* ---------- game ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ibtn{flex:none;width:58px;height:58px;border:4px solid var(--ink);border-radius:18px;background:var(--paper);
  box-shadow:0 5px 0 var(--ink);font-size:28px;line-height:1;display:grid;place-items:center;padding:0}
.ibtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ibtn[aria-pressed="false"]{background:#D6DEEA}
.progress{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--paper);border:4px solid var(--ink);
  border-radius:18px;box-shadow:0 5px 0 var(--ink);height:58px;padding:0 12px}
.track{flex:1;height:20px;border:3px solid var(--ink);border-radius:12px;background:var(--mat);overflow:hidden}
.fill{height:100%;width:0;background:var(--grass);transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.tally{font-weight:800;font-size:22px;white-space:nowrap}
.tally::before{content:"★ ";color:var(--sun);text-shadow:0 0 1px var(--ink),0 0 1px var(--ink)}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none}
#board{position:absolute;z-index:1;background:var(--mat);border-radius:4px;
  box-shadow:0 0 0 8px var(--sun),0 0 0 12px var(--ink),0 10px 0 12px var(--ink)}
#board.done{animation:glow .9s ease-in-out 2}
@keyframes glow{50%{box-shadow:0 0 0 8px var(--paper),0 0 0 12px var(--ink),0 10px 0 12px var(--ink),0 0 40px 20px var(--sun)}}
#ghost{display:block}
.piece{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;transform-origin:center;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));scale:1;transition:scale .12s}
.piece.lifted{filter:drop-shadow(0 12px 10px rgba(0,0,0,.4))}
.piece.snapping{transition:transform .2s cubic-bezier(.3,1.5,.5,1),scale .2s}
.piece.placed{filter:none}
.spark{position:absolute;left:-9px;top:-9px;width:18px;height:18px;z-index:900;pointer-events:none;background:var(--c);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  animation:spark .65s ease-out forwards}
@keyframes spark{from{transform:translate(var(--x0),var(--y0)) scale(1.2) rotate(0);opacity:1}
  to{transform:translate(var(--x1),var(--y1)) scale(.3) rotate(160deg);opacity:0}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:1500;background:rgba(29,43,83,.55);display:grid;place-items:center;padding:20px}
.modal .card{width:min(420px,100%);text-align:center}
.modal h2{margin:4px 0 16px;font-size:30px}
.modal .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.modal .big{font-size:24px}

/* ---------- win ---------- */
.win{position:fixed;inset:0;z-index:2000;overflow:hidden;display:grid;place-items:center;background:var(--sun)}
.win::before{content:"";position:absolute;inset:-60%;
  background:repeating-conic-gradient(from 0deg,#FFD23F 0 10deg,#FFB627 10deg 20deg);animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.win-inner{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:min(2vh,14px);
  padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));text-align:center;max-height:100%}
.welldone{margin:0;font-weight:800;line-height:.9;font-size:min(9vw,10vh,76px)}
.name{margin:0;font-weight:800;line-height:.92;font-size:min(15vw,16vh,150px)}
.name .line{display:block;white-space:nowrap}
.name span span{animation:hop 1.1s ease-in-out infinite;animation-delay:var(--d)}
@keyframes hop{0%,100%{transform:translateY(0) rotate(var(--r))}40%{transform:translateY(-.18em) rotate(calc(var(--r) * -1))}}
#winPic{display:block;max-width:min(78vw,520px);max-height:24vh;border:5px solid var(--ink);border-radius:14px;
  box-shadow:0 7px 0 var(--ink);background:var(--paper);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both .2s}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.win .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.win .big{font-size:clamp(22px,5vw,32px)}

@media (prefers-reduced-motion: reduce){
  .win::before,.name span span,#board.done{animation:none}
  .spark{animation-duration:.3s}
  .piece.hint{animation:none;filter:drop-shadow(0 0 10px #FFD23F) drop-shadow(0 0 5px #FFD23F)}
  .spot{animation:none;opacity:.85}
}
</style>
</head>
<body>
<div id="app">

  <section id="start" class="screen">
    <div class="start-inner">
      <h1 class="title" id="title" aria-label="Puzzle Time!"></h1>
      <p class="hello">Hi Matthew Finn!</p>

      <div class="card resume" id="resumeCard" hidden>
        <div class="resume-row"><div class="rthumb" id="resumeThumb"></div>
          <div><p class="step">Carry on your puzzle?</p><p class="sub" id="resumeInfo"></p></div></div>
        <div class="row2">
          <button class="big" id="resumeBtn" type="button">Carry on!</button>
          <button class="chip tidy" id="resumeNo" type="button">Start a new one</button>
        </div>
      </div>

      <div class="card">
        <p class="step">Pick a picture</p>
        <label class="picker" id="picker">
          <input type="file" id="file" accept="image/*" multiple>
          <img id="preview" alt="Your puzzle picture">
          <span class="ph"><span class="cam" aria-hidden="true">📷</span><b>Tap to pick a picture</b><span>Any photo works</span></span>
          <span class="change">Change</span>
        </label>
        <div class="recent">
          <div class="recent-head"><p class="step">Ready-made pictures</p></div>
          <div class="presets" id="presets"></div>
        </div>
        <div class="recent">
          <div class="recent-head"><p class="step">⭐ My pictures</p><button class="chip tidy tidyBtn" type="button" aria-pressed="false">Edit</button></div>
          <div class="thumbs" id="myThumbs">
            <label class="thumb add" aria-label="Add pictures to My pictures"><input type="file" id="fileKeep" accept="image/*" multiple><span aria-hidden="true">＋</span></label>
          </div>
          <p class="myhint" id="myHint">Tap ＋ to add favourites. You can pick lots at once, and they stay here for good.</p>
        </div>
        <div class="recent" id="recentWrap" hidden>
          <div class="recent-head"><p class="step">Your last pictures</p><button class="chip tidy tidyBtn" type="button" aria-pressed="false">Edit</button></div>
          <div class="thumbs" id="thumbs"></div>
        </div>
      </div>

      <div class="card">
        <p class="step">Which way round?</p>
        <div class="shapes" role="group" aria-label="Puzzle shape">
          <button class="count shape" data-o="land" style="--bg:var(--blue)" aria-pressed="true" type="button"><span class="ic" style="width:64px;height:48px"></span><span class="w">Landscape</span></button>
          <button class="count shape" data-o="port" style="--bg:var(--grape)" aria-pressed="false" type="button"><span class="ic" style="width:40px;height:54px"></span><span class="w">Portrait</span></button>
        </div>
      </div>

      <div class="card">
        <p class="step">How many pieces?</p>
        <div class="counts" role="group" aria-label="Number of pieces">
          <button class="count" data-n="24" style="--bg:var(--grass)" aria-pressed="true" type="button"><span class="n">24</span><span class="w">Easy peasy</span></button>
          <button class="count" data-n="36" style="--bg:var(--sun)" aria-pressed="false" type="button"><span class="n">36</span><span class="w">Bit tricky</span></button>
          <button class="count" data-n="48" style="--bg:var(--tomato)" aria-pressed="false" type="button"><span class="n">48</span><span class="w">Super tricky</span></button>
        </div>
      </div>

      <p class="err" id="err" role="alert" hidden></p>
      <button class="big" id="playBtn" type="button" disabled>Let's play!</button>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <header class="bar">
      <button class="ibtn" id="homeBtn" type="button" aria-label="Stop puzzle">🏠</button>
      <div class="progress" aria-live="polite"><div class="track"><div class="fill" id="fill"></div></div><span class="tally" id="tally">0 of 24</span></div>
      <button class="ibtn" id="helpBtn" type="button" aria-label="Help me find a piece">💡</button>
      <button class="ibtn" id="peekBtn" type="button" aria-label="Show faint picture" aria-pressed="true">👀</button>
      <button class="ibtn" id="soundBtn" type="button" aria-label="Sound" aria-pressed="true">🔊</button>
    </header>
    <div id="stage"><div id="board"><canvas id="ghost"></canvas></div></div>
  </section>

  <div class="modal" id="confirm" hidden>
    <div class="card">
      <h2>Stop this puzzle?</h2>
      <div class="row">
        <button class="big green" id="keepBtn" type="button">Keep playing</button>
        <button class="big" id="stopBtn" type="button">Stop</button>
      </div>
    </div>
  </div>

  <div class="win" id="win" hidden>
    <canvas id="confetti"></canvas>
    <div class="win-inner">
      <p class="welldone outline" id="welldone" aria-label="Well done"></p>
      <h2 class="name outline" id="name" aria-label="Matthew Finn!"></h2>
      <canvas id="winPic"></canvas>
      <div class="row">
        <button class="big green" id="againBtn" type="button">Play again</button>
        <button class="big blue" id="newBtn" type="button">New picture</button>
      </div>
    </div>
  </div>
</div>

/* ---------- fancy letters ---------- */
function letters(el, text, opts = {}){
  el.innerHTML = '';
  const lines = opts.lines || [text];
  let k = 0;
  lines.forEach(line => {
    const wrap = document.createElement('span');
    wrap.className = opts.lineClass || 'word';
    for (const ch of line){
      const s = document.createElement('span');
      s.textContent = ch === ' ' ? '\u00A0' : ch;
      s.style.setProperty('--c', COLS[k % COLS.length]);
      s.style.setProperty('--r', ((k % 2 ? 1 : -1) * (3 + (k*7)%4)) + 'deg');
      s.style.setProperty('--d', (k * 0.08) + 's');
      s.setAttribute('aria-hidden','true');
      wrap.appendChild(s); k++;
    }
    el.appendChild(wrap);
  });
}
letters($('#title'), '', {lines:['Puzzle','Time!']});
letters($('#welldone'), '', {lines:['Well done'], lineClass:'line'});

function ac(){
  if (!actx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone({f=440,f2=0,type='sine',t=0,d=.15,v=.2}){
  if (!state.sound) return; const a = ac(); if (!a) return;
  const now = a.currentTime + t, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, now);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, now + d);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(v, now + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, now + d);
  o.connect(g).connect(a.destination); o.start(now); o.stop(now + d + 0.03);
}
function noise({t=0,d=.05,v=.2,hp=1800}){
  if (!state.sound) return; const a = ac(); if (!a) return;
  const now = a.currentTime + t, len = Math.floor(a.sampleRate * d);
  const buf = a.createBuffer(1, len, a.sampleRate), data = buf.getChannelData(0);
  for (let i=0;i<len;i++) data[i] = (Math.random()*2-1) * (1 - i/len);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = v;
  src.connect(f).connect(g).connect(a.destination); src.start(now);
}

  drop(){ tone({f:260,f2:150,type:'triangle',d:.13,v:.22}); },

    const n = SCALE[i % SCALE.length];
    tone({f:n,t:.03,d:.4,v:.18}); tone({f:n*2,t:.03,d:.25,v:.05});

    [523.25,659.25,783.99,1046.5].forEach((f,i)=>{ tone({f,type:'triangle',t:i*.13,d:.3,v:.22}); tone({f:f*2,t:i*.13,d:.22,v:.06}); });

let voiceBuf = null, voiceSrc = null;
function loadVoice(){
  const a = ac(); if (!a || voiceBuf) return;
  try{
    const bin = atob(VOICE_B64), u = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
    a.decodeAudioData(u.buffer, b => { voiceBuf = b; }, () => {});
  }catch(e){}
}
function sayWellDone(){
  if (!state.sound) return;
  const a = ac();
  if (a && voiceBuf){
    try{ voiceSrc = a.createBufferSource(); voiceSrc.buffer = voiceBuf; voiceSrc.connect(a.destination); voiceSrc.start(); return; }catch(e){}
  }
  if (!('speechSynthesis' in window)) return; // fallback only if the clip couldn't load
  try{
    const u = new SpeechSynthesisUtterance('Well done, Matthew Finn! You did it!');
    u.rate = .95; u.pitch = 1.3; speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };

/* ---------- picture picking ---------- */
function toCanvas(img, max = 1600){
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const k = Math.min(1, max / Math.max(iw, ih));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(iw*k)); c.height = Math.max(1, Math.round(ih*k));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const loadURL = url => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
function showErr(t){ const e = $('#err'); e.textContent = t; e.hidden = false; }
function hideErr(){ $('#err').hidden = true; }
function setImage(c){
  state.img = c;
  $('#preview').src = c.toDataURL('image/jpeg', .85);
  $('#picker').classList.add('has-img');
  $('#playBtn').disabled = false;
  hideErr();
  setOrient(c.width >= c.height ? 'land' : 'port');
}
function setOrient(o){
  state.orient = o;
  document.querySelectorAll('.shape').forEach(b => b.setAttribute('aria-pressed', b.dataset.o === o ? 'true' : 'false'));
  const p = $('#picker'); p.style.setProperty('--ar', o === 'land' ? '4/3' : '3/4'); p.classList.toggle('port', o === 'port');
}
document.querySelectorAll('.shape').forEach(b => b.addEventListener('click', () => { setOrient(b.dataset.o); SND.click(); }));
const readFile = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
async function handleFiles(files, keep){
  const list = [...(files || [])].filter(f => !f.type || f.type.startsWith('image/'));
  if (!list.length){ showErr("That file isn't a picture. Pick a photo (JPG or PNG)."); return; }
  let first = true, bad = 0;
  for (const f of list){
    try{
      const c = toCanvas(await loadURL(await readFile(f)));
      if (first){ presetIdx = -1; markPresets(); setImage(c); SND.click(); }
      await savePicture(c, first, keep); first = false;
    }catch(err){ bad++; }
  }
  if (bad) showErr(bad === list.length ? "That picture wouldn't open. Try a JPG or PNG photo." : `${bad} of those pictures wouldn't open. The rest are saved.`);
}
$('#file').addEventListener('change', async e => { await handleFiles(e.target.files, false); e.target.value = ''; });
$('#fileKeep').addEventListener('change', async e => { await handleFiles(e.target.files, true); e.target.value = ''; });

/* ---------- last 10 pictures (IndexedDB) ---------- */
const DB = {
  db:null,
  open(){ return new Promise(res => {
    if (this.db) return res(this.db);
    try{
      const r = indexedDB.open('mf-puzzle', 2);
      r.onupgradeneeded = () => { const d = r.result;
        if (!d.objectStoreNames.contains('pics')) d.createObjectStore('pics', {keyPath:'id'});
        if (!d.objectStoreNames.contains('game')) d.createObjectStore('game', {keyPath:'id'}); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => res(null);
    }catch(e){ res(null); }

}

/* ---------- layout ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function place(pc){
  pc.el.style.transform = `translate3d(${pc.x - state.o}px,${pc.y - state.o}px,0)`;
  pc.el.style.setProperty('scale', pc.lifted ? '1.04' : '1');
}
function layout(scatter){
  const W = stage.clientWidth, H = stage.clientHeight; if (!W || !H) return;
  const {cols, rows} = state, m = Math.max(22, Math.min(W,H)*.04), land = W >= H*1.05;
  const aw = land ? W*.6 - 2*m : W - 2*m, ah = land ? H - 2*m - 10 : H*.56 - 2*m;
  const fitW = Math.min(aw, ah*state.aspect);
  const pw = Math.max(20, Math.floor(fitW/cols)), ph = Math.max(20, Math.floor(fitW/state.aspect/rows));
  const bw = pw*cols, bh = ph*rows;
  let bx, by;
  if (land){ bx = m; by = Math.round((H - bh)/2 - 5); state.tray = {x0:bx+bw+m*1.3, x1:W-m*.4, y0:m*.4, y1:H-m*.4}; }
  else { bx = Math.round((W - bw)/2); by = m; state.tray = {x0:m*.4, x1:W-m*.4, y0:by+bh+m*1.5, y1:H-m*.4}; }
  state.pw = pw; state.ph = ph; state.o = Math.ceil(Math.min(pw, ph)*.36); state.board = {x:bx, y:by};
  Object.assign(boardEl.style, {left:bx+'px', top:by+'px', width:bw+'px', height:bh+'px'});
  drawGhost();
  state.pieces.forEach(pc => {
    renderPiece(pc);
    if (pc.placed){ pc.x = bx + pc.c*pw; pc.y = by + pc.r*ph; }
  });
  if (scatter) scatterLoose();
  state.pieces.forEach(place);
}
function scatterLoose(){
  const loose = shuffle(state.pieces.filter(p => !p.placed)), n = loose.length; if (!n) return;
  const {pw, ph, o, tray} = state, pad = Math.max(o*.9, 16);
  let x0 = tray.x0 + pad, x1 = tray.x1 - pw - pad, y0 = tray.y0 + pad, y1 = tray.y1 - ph - pad;
  if (x1 < x0){ x0 = x1 = Math.max(0, (tray.x0 + tray.x1 - pw)/2); }
  if (y1 < y0){ y0 = y1 = Math.max(0, (tray.y0 + tray.y1 - ph)/2); }
  const w = x1 - x0, h = y1 - y0;
  const gc = Math.max(1, Math.round(Math.sqrt(n*(w+pw)/(h+ph)))), gr = Math.ceil(n/gc);
  loose.forEach((p, i) => {
    const fx = gc > 1 ? (i % gc)/(gc-1) : .5, fy = gr > 1 ? Math.floor(i/gc)/(gr-1) : .5;
    const jx = (Math.random()-.5) * (w/gc) * .5, jy = (Math.random()-.5) * (h/gr) * .5;
    p.x = clamp(x0 + fx*w + jx, x0, x1); p.y = clamp(y0 + fy*h + jy, y0, y1);

}

/* ---------- game flow ---------- */
function startGame(saved){
  if (!saved && !state.img) return;
  ac(); loadVoice(); clearHint();
  let edges, done = new Set();
  if (saved){
    Object.assign(state, {count:saved.count, orient:saved.orient, cols:saved.cols, rows:saved.rows, src:saved.src, gid:saved.gid, img:saved.src});
    state.aspect = saved.orient === 'land' ? 4/3 : 3/4;
    edges = saved.e; done = new Set(saved.placed);
  } else {
    const g = GRIDS[state.count], land = state.orient === 'land';
    [state.cols, state.rows] = land ? g : [g[1], g[0]];
    state.aspect = land ? 4/3 : 3/4;
    state.src = buildSource(state.img, state.aspect);
    const {cols, rows} = state, rnd = () => Math.random() < .5 ? 1 : -1, Hs = [], Vs = [];
    for (let r=0;r<rows;r++){ Hs[r] = []; Vs[r] = []; for (let c=0;c<cols;c++){ Hs[r][c] = r > 0 ? rnd() : 0; Vs[r][c] = c > 0 ? rnd() : 0; } }
    edges = [];
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++)
      edges.push([ -Hs[r][c], c < cols-1 ? Vs[r][c+1] : 0, r < rows-1 ? Hs[r+1][c] : 0, -Vs[r][c] ]);
    state.gid = 'g' + Date.now();
    const src = state.src, gid = state.gid;
    DB.gput({id:'img', gid, data:src.toDataURL('image/jpeg', .85), thumb:thumbURL(src)});
  }
  stage.querySelectorAll('.piece,.spark,.spot,.near').forEach(n => n.remove()); nearSpot = null;
  state.pieces = [];
  const {cols, rows} = state;
  for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
    const i = r*cols + c, placed = done.has(i);
    const el = document.createElement('canvas'); el.className = 'piece' + (placed ? ' placed' : ''); stage.appendChild(el);
    if (placed) el.style.zIndex = 2;
    state.pieces.push({i, c, r, e:edges[i], el, x:0, y:0, z:0, placed, lifted:false});
  }
  state.placed = done.size; state.done = false; drag = null;
  boardEl.classList.remove('done');
  $('#resumeCard').hidden = true;
  $('#start').hidden = true; $('#game').hidden = false; $('#win').hidden = true;
  saveProgress();
  requestAnimationFrame(() => { layout(true); updateProgress(); });
}

}

function nearTarget(pc, fx, fy){

function clearHint(){

function showHint(){

  const pc = pool[Math.floor(Math.random()*pool.length)], {pw, ph, o} = state;
  pc.z = ++zTop; pc.el.style.zIndex = pc.z; pc.el.classList.add('hint');
  const spot = makeSpot(pc, 'spot', 'rgba(255,210,63,.6)', '#FFB627');
  state.hint = {pc, spot};
  SND.hint();
  hintT = setTimeout(clearHint, 4000);
}
$('#helpBtn').addEventListener('click', () => showHint());
function updateProgress(){
  const t = state.pieces.length;
  $('#fill').style.width = (t ? state.placed/t*100 : 0) + '%';
  $('#tally').textContent = `${state.placed} of ${t}`;
}
function goHome(){
  stopConfetti(); clearHint();
  checkResume();
  $('#win').hidden = true; $('#confirm').hidden = true; $('#game').hidden = true; $('#start').hidden = false;
}
$('#playBtn').addEventListener('click', () => { SND.click(); startGame(); });
$('#homeBtn').addEventListener('click', () => { SND.click(); $('#confirm').hidden = false; });
$('#keepBtn').addEventListener('click', () => { SND.click(); $('#confirm').hidden = true; });
$('#stopBtn').addEventListener('click', () => { SND.click(); goHome(); });
$('#peekBtn').addEventListener('click', e => { state.peek = !state.peek; e.currentTarget.setAttribute('aria-pressed', state.peek); drawGhost(); SND.click(); });
$('#soundBtn').addEventListener('click', e => {
  state.sound = !state.sound; e.currentTarget.setAttribute('aria-pressed', state.sound);
  e.currentTarget.textContent = state.sound ? '🔊' : '🔇'; SND.click();
});
$('#againBtn').addEventListener('click', () => { SND.click(); stopConfetti(); startGame(); });
$('#newBtn').addEventListener('click', () => { SND.click(); goHome(); });

/* ---------- dragging ---------- */
const hit = document.createElement('canvas').getContext('2d');
function pieceAt(x, y){
  const {pw, ph, o} = state; let best = null;
  for (const pc of state.pieces){
    if (pc.placed || !pc.path) continue;
    const lx = x - (pc.x - o), ly = y - (pc.y - o);
    if (lx < 0 || ly < 0 || lx > pw + 2*o || ly > ph + 2*o) continue;
    if (hit.isPointInPath(pc.path, lx, ly) && (!best || pc.z > best.z)) best = pc;
  }
  if (!best){ // forgiving for little fingers
    const g = Math.min(pw, ph)*.15;
    for (const pc of state.pieces){
      if (pc.placed) continue;
      if (x > pc.x - g && x < pc.x + pw + g && y > pc.y - g && y < pc.y + ph + g && (!best || pc.z > best.z)) best = pc;
    }
  }
  return best;
}
function localXY(e){ const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
stage.addEventListener('pointerdown', e => {
  if (drag || state.done) return;
  ac();
  const [x, y] = localXY(e), pc = pieceAt(x, y); if (!pc) return;
  e.preventDefault();
  drag = {pc, id:e.pointerId, dx:x - pc.x, dy:y - pc.y};
  pc.z = ++zTop; pc.el.style.zIndex = pc.z; pc.lifted = true; pc.el.classList.add('lifted');
  if (state.hint && state.hint.pc === pc){ clearTimeout(hintT); pc.el.classList.remove('hint'); }
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  place(pc); SND.pick();
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const [x, y] = localXY(e), {pc} = drag, {pw, ph} = state;
  const bd = state.board, gap = state.o*.5, W = stage.clientWidth, H = stage.clientHeight;
  pc.x = clamp(x - drag.dx, Math.min(gap, bd.x), Math.max(W - pw - gap, bd.x + (state.cols-1)*pw));
  pc.y = clamp(y - drag.dy, Math.min(gap, bd.y), Math.max(H - ph - gap, bd.y + (state.rows-1)*ph));
  place(pc);
});
function endDrag(e){
  if (!drag || e.pointerId !== drag.id) return;
  const {pc} = drag; drag = null;
  pc.lifted = false; pc.el.classList.remove('lifted');
  const tx = state.board.x + pc.c*state.pw, ty = state.board.y + pc.r*state.ph, [fx, fy] = localXY(e);
  setNear(pc, false);
  if (nearTarget(pc, fx, fy)) snap(pc, tx, ty);
  else { place(pc); SND.drop(); if (state.hint && state.hint.pc === pc){ clearTimeout(hintT); hintT = setTimeout(clearHint, 2500); } }
}
stage.addEventListener('pointerup', endDrag);
// stop iPad scroll/bounce/edge gestures from stealing a drag
['touchstart','touchmove'].forEach(ev => stage.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, {passive:false}));
stage.addEventListener('pointercancel', endDrag);

function snap(pc, tx, ty){
  pc.placed = true; pc.x = tx; pc.y = ty;
  pc.el.classList.add('snapping', 'placed'); pc.el.style.zIndex = 2;
  place(pc);
  setTimeout(() => pc.el.classList.remove('snapping'), 260);
  state.placed++;
  if (state.hint && state.hint.pc === pc) clearHint();
  saveProgress();
  SND.snap(state.placed - 1); buzz(20);
  sparkle(tx + state.pw/2, ty + state.ph/2);
  updateProgress();
  if (state.placed === state.pieces.length){ state.done = true; setTimeout(win, 650); }
}
function sparkle(cx, cy){
  const n = 10;
  for (let i=0;i<n;i++){
    const d = document.createElement('div'); d.className = 'spark';
    const a = i/n*Math.PI*2 + Math.random()*.4, dist = Math.min(state.pw, state.ph)*(.55 + Math.random()*.45);
    d.style.setProperty('--c', COLS[i % COLS.length]);
    d.style.setProperty('--x0', cx + 'px'); d.style.setProperty('--y0', cy + 'px');
    d.style.setProperty('--x1', (cx + Math.cos(a)*dist) + 'px'); d.style.setProperty('--y1', (cy + Math.sin(a)*dist) + 'px');
    stage.appendChild(d); setTimeout(() => d.remove(), 700);
  }
}

/* ---------- winning ---------- */
function win(){
  boardEl.classList.add('done');
  DB.gclear(); clearHint();
  setTimeout(() => {
    const pic = $('#winPic'); pic.width = state.src.width; pic.height = state.src.height;
    pic.getContext('2d').drawImage(state.src, 0, 0);
    $('#win').hidden = false;
    SND.win(); buzz([40,60,40,60,80]);
    setTimeout(sayWellDone, 1400);
    startConfetti();
  }, 700);
}
let confRAF = 0;
function stopConfetti(){ cancelAnimationFrame(confRAF); confRAF = 0; try{ speechSynthesis.cancel(); }catch(e){} try{ voiceSrc && voiceSrc.stop(); }catch(e){} voiceSrc = null; }
function startConfetti(){
  const cv = $('#confetti'), x = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = [...COLS, '#FFFFFF'], parts = [], t0 = performance.now();
  const add = n => { for (let i=0;i<n;i++) parts.push({x:Math.random()*W, y:-20 - Math.random()*H*.4, w:8+Math.random()*9, h:10+Math.random()*12,
    vy:2+Math.random()*3.5, vx:(Math.random()-.5)*2, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:colors[(Math.random()*colors.length)|0], ph:Math.random()*6}); };
  add(reduce ? 40 : 170);
  const step = t => {
    x.clearRect(0, 0, W, H);
    if (!reduce && t - t0 < 4000) add(3);
    for (const p of parts){
      p.y += p.vy; p.x += p.vx + Math.sin(t/350 + p.ph)*.9; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w/2, -p.h/2, p.w, p.h); x.restore();
    }
    for (let i=parts.length-1;i>=0;i--) if (parts[i].y > H + 30) parts.splice(i, 1);
    if (parts.length) confRAF = requestAnimationFrame(step); else x.clearRect(0, 0, W, H);
  };
  cancelAnimationFrame(confRAF); confRAF = requestAnimationFrame(step);
}

/* ---------- resize ---------- */
let rt = 0;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if ($('#game').hidden || !state.pieces.length) return;
    if (drag){ drag.pc.lifted = false; drag.pc.el.classList.remove('lifted'); drag = null; }
    clearHint();
    layout(true);
  }, 180);
});
})();
</script>
