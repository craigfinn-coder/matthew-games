<title>Splash &amp; Scrub</title>
<style>
:root{
  --sky:#8AD8FF; --dots:rgba(255,255,255,.4);
  --sun:#FFD23F; --tomato:#FF5A4E; --grass:#26B36B; --grape:#7B5CFF; --blue:#3A8DFF;
  --ink:#1D2B53; --paper:#FFFFFF; --mat:#EAF7FF;
  --font:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sky:#24407A; --dots:rgba(255,255,255,.12); } }
:root[data-theme="dark"]{ --sky:#24407A; --dots:rgba(255,255,255,.12); }
html{height:100%;overscroll-behavior:none;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;font-family:var(--font);color:var(--ink);background:var(--sky);
  background-image:radial-gradient(var(--dots) 2px,transparent 2.6px);background-size:28px 28px;
  overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,label:focus-within{outline:4px solid var(--grape);outline-offset:4px}
[hidden]{display:none !important}
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ibtn{flex:none;width:58px;height:58px;border:4px solid var(--ink);border-radius:18px;background:var(--paper);
  box-shadow:0 5px 0 var(--ink);font-size:28px;line-height:1;display:grid;place-items:center;padding:0}
.ibtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ibtn[aria-pressed="false"]{background:#D6DEEA}
.tray{flex:1;min-width:0;height:58px;display:flex;align-items:center;gap:8px;background:var(--paper);
  border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:0 12px;font-weight:800;font-size:22px}
.steps{display:flex;gap:6px;align-items:center}
.stepchip{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:20px;background:#E3E9F2;position:relative}
.stepchip.now{background:conic-gradient(var(--grass) var(--p,0%), var(--sun) 0);animation:nudge 1s ease-in-out infinite}
.stepchip.done{background:var(--grass)}
.stepchip.done::after{content:"✓";position:absolute;right:-8px;bottom:-8px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);font-size:14px;display:grid;place-items:center;color:var(--grass)}
@keyframes nudge{50%{transform:scale(1.12)}}
.washed{margin-left:auto;white-space:nowrap}
.main{flex:1;min-height:0;display:flex;gap:14px;padding:0 12px 14px}
#stageBox{flex:1;min-width:0;min-height:0;display:grid;place-items:center;overflow:hidden}
#scene{display:block;touch-action:none;border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);cursor:none}
.side{display:flex;flex-direction:column;justify-content:center;gap:12px}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink);padding:10px}
.panel h2{margin:0 0 8px;font-size:20px;text-align:center}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{border:4px solid var(--ink);border-radius:20px;background:var(--mat);box-shadow:0 6px 0 var(--ink);font-size:42px;line-height:1;padding:8px 0 4px}
.tool small{display:block;font-size:15px;font-weight:800;margin-top:4px}
.tool.now{background:var(--sun);animation:nudge 1s ease-in-out infinite}
.tool.done{background:#C9F2DA}
.tool:disabled{opacity:.45;cursor:default}
.tool svg{width:44px;height:44px;display:block;margin:0 auto}
.fleet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:36vh;overflow-y:auto;padding:4px}
.veh{aspect-ratio:16/10;border:3px solid var(--ink);border-radius:12px;background:var(--mat) center/88% no-repeat;padding:0;box-shadow:0 3px 0 var(--ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tab{border:3px solid var(--ink);border-radius:14px;background:var(--mat);font-weight:800;font-size:17px;padding:4px 2px;box-shadow:0 3px 0 var(--ink)}
.tab[aria-pressed="true"]{background:var(--sun);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.veh[aria-pressed="true"]{background-color:var(--sun);outline:3px solid var(--tomato);outline-offset:2px}
@media (orientation:landscape){ .side{width:min(30%,290px)} }
@media (orientation:portrait){
  .main{flex-direction:column}
  .side{flex-direction:row;align-items:stretch}
  .side .panel:first-child{flex:1.1}
  .side .panel:last-child{flex:1}
  .tools{grid-template-columns:repeat(4,1fr)}
  .fleet{grid-template-columns:repeat(3,1fr);max-height:190px}
}

.modal{position:fixed;inset:0;z-index:1500;background:rgba(29,43,83,.55);display:grid;place-items:center;padding:16px}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:18px}
.sheet{width:min(560px,100%);max-height:calc(100vh - 32px);overflow-y:auto}
.sheet h2{margin:0 0 4px;font-size:28px}
.step{margin:14px 0 8px;font-size:21px;font-weight:800}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{border:4px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:0 6px 0 var(--ink);padding:6px 4px;font-weight:800;font-size:26px;line-height:1.1}
.opt small{display:block;font-size:13px;font-weight:600}
.opt[aria-pressed="true"]{background:var(--sun);transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.thumbs{display:flex;flex-wrap:wrap;gap:14px;padding:12px 4px 4px}
.thumb{position:relative;width:96px;height:64px;border:4px solid var(--ink);border-radius:14px;background:var(--mat) center/contain no-repeat;box-shadow:0 4px 0 var(--ink)}
.thumb.add{display:grid;place-items:center;background:var(--sun);cursor:pointer;font-size:40px;font-weight:800;line-height:1}
.thumb.add input{position:absolute;opacity:0;width:1px;height:1px}
.thumb .x{position:absolute;top:-12px;right:-12px;width:32px;height:32px;border-radius:50%;border:3px solid var(--ink);
  background:var(--tomato);color:#fff;font-weight:800;font-size:15px;line-height:1;padding:0;display:grid;place-items:center}
.note{margin:8px 0 0;font-size:16px;font-weight:600}
.err{margin:10px 0 0;border:3px solid var(--tomato);border-radius:14px;padding:6px 12px;font-weight:600}
.big{border:4px solid var(--ink);border-radius:24px;background:var(--tomato);color:var(--paper);font-weight:800;
  font-size:clamp(24px,5vw,32px);padding:8px 20px;box-shadow:0 8px 0 var(--ink);text-shadow:0 3px 0 var(--ink)}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.big.green{background:var(--grass)}
.sheet .big{width:100%;margin-top:18px}

.win{position:fixed;inset:0;z-index:2000;overflow:hidden;display:grid;place-items:center;background:var(--sun)}
.win::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,#FFD23F 0 10deg,#FFB627 10deg 20deg);animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.win-inner{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:min(2vh,14px);padding:16px;text-align:center;max-height:100%}
.outline span span{display:inline-block;color:var(--c);transform:rotate(var(--r,0deg));
  text-shadow:-3px 0 var(--ink),3px 0 var(--ink),0 -3px var(--ink),0 3px var(--ink),-2px -2px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),0 8px 0 var(--ink)}
.line{display:block;white-space:nowrap}
.welldone{margin:0;font-weight:800;line-height:.9;font-size:min(9vw,10vh,80px)}
.name{margin:0;font-weight:800;line-height:.92;font-size:min(15vw,16vh,150px)}
.name span span{animation:hop 1.1s ease-in-out infinite;animation-delay:var(--d)}
@keyframes hop{0%,100%{transform:translateY(0) rotate(var(--r))}40%{transform:translateY(-.18em) rotate(calc(var(--r) * -1))}}
.haul{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:min(92vw,700px)}
.haul img{width:min(18vw,16vh,120px);height:auto;animation:land .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
@keyframes land{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
@media (prefers-reduced-motion: reduce){ .win::before,.name span span,.stepchip.now,.tool.now{animation:none} }
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <a class="ibtn" href="./" aria-label="All games" style="text-decoration:none">🏠</a>
    <div class="tray" aria-live="polite">
      <div class="steps" id="steps"></div>
      <span class="washed">🚗 <span id="washed">0</span></span>
    </div>
    <button class="ibtn" id="setBtn" type="button" aria-label="Grown-ups: setup">⚙️</button>
    <button class="ibtn" id="soundBtn" type="button" aria-label="Sound" aria-pressed="true">🔊</button>
  </header>
  <div class="main">
    <div id="stageBox"><canvas id="scene" aria-label="A muddy vehicle in the car wash. Soap it, rinse it, dry it and make it sparkle."></canvas></div>
    <div class="side">
      <div class="panel"><h2>Tools</h2><div class="tools" id="tools"></div></div>
      <div class="panel"><div class="tabs"><button class="tab" data-t="veh" type="button">🚗 Vehicles</button><button class="tab" data-t="ani" type="button">🐶 Animals</button></div><div class="fleet" id="fleet"></div></div>
    </div>
  </div>
</div>

<div class="modal" id="settings" hidden>
  <div class="card sheet">
    <h2>Grown-ups: setup</h2>
    <p class="step">Big party after how many washes?</p>
    <div class="opts">
      <button class="opt party" data-n="3" type="button">3</button>
      <button class="opt party" data-n="5" type="button">5</button>
      <button class="opt party" data-n="8" type="button">8</button>
    </div>
    <p class="step">My vehicles</p>
    <div class="thumbs" id="myVehs">
      <label class="thumb add" aria-label="Add vehicle pictures"><input type="file" id="vehFile" accept="image/*" multiple><span aria-hidden="true">＋</span></label>
    </div>
    <p class="note">Tap ＋ and pick as many as you like: toy cars, trucks, boats. A picture with a see-through background gets washed in its own shape. Normal photos are washed as a picture card.</p>
    <p class="err" id="err" hidden></p>
    <button class="big green" id="doneBtn" type="button">Done</button>
  </div>
</div>

<div class="win" id="win" hidden>
  <canvas id="confetti"></canvas>
  <div class="win-inner">
    <p class="welldone outline" id="topTxt" aria-label="Squeaky clean!"></p>
    <h2 class="name outline" id="name" aria-label="Matthew Finn!"></h2>
    <div class="haul" id="haul"></div>
    <button class="big green" id="againBtn" type="button">Keep washing</button>
  </div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const COLS = ['#FF5A4E','#FFD23F','#26B36B','#7B5CFF','#3A8DFF'];
const INK = '#1D2B53', TAU = Math.PI*2;
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
const settings = { party: [3,5,8].includes(+store.get('cw-party')) ? +store.get('cw-party') : 5, sound:true };

function letters(el, lines){
  el.innerHTML = ''; let k = 0;
  lines.forEach(line => { const w = document.createElement('span'); w.className = 'line';
    for (const ch of line){ const s = document.createElement('span'); s.textContent = ch === ' ' ? '\u00A0' : ch;
      s.style.setProperty('--c', COLS[k % COLS.length]); s.style.setProperty('--r', ((k % 2 ? 1 : -1) * (3 + (k*7)%4)) + 'deg');
      s.style.setProperty('--d', (k*.08) + 's'); s.setAttribute('aria-hidden','true'); w.appendChild(s); k++; }
    el.appendChild(w); });
}
letters($('#topTxt'), ['Squeaky clean!']);
letters($('#name'), ['MATTHEW','FINN!']);

/* ---------- sound ---------- */
let actx = null;
function ac(){ if (!actx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); } if (actx.state === 'suspended') actx.resume(); return actx; }
function tone({f=440,f2=0,type='sine',t=0,d=.15,v=.2}){
  if (!settings.sound) return; const a = ac(); if (!a) return;
  const now = a.currentTime + t, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, now); if (f2) o.frequency.exponentialRampToValueAtTime(f2, now + d);
  g.gain.setValueAtTime(.0001, now); g.gain.exponentialRampToValueAtTime(v, now + .006); g.gain.exponentialRampToValueAtTime(.0001, now + d);
  o.connect(g).connect(a.destination); o.start(now); o.stop(now + d + .03);
}
function noise({t=0,d=.05,v=.2,type='highpass',fq=1800,q=1}){
  if (!settings.sound) return; const a = ac(); if (!a) return;
  const now = a.currentTime + t, len = Math.max(1, Math.floor(a.sampleRate*d)), buf = a.createBuffer(1, len, a.sampleRate), data = buf.getChannelData(0);
  for (let i=0;i<len;i++) data[i] = (Math.random()*2-1)*(1 - i/len);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = type; f.frequency.value = fq; f.Q.value = q; g.gain.value = v; s.connect(f).connect(g).connect(a.destination); s.start(now);
}
let hoseNode = null;
function hose(on){
  const a = ac(); if (!a) return;
  if (on && settings.sound && !hoseNode){
    const len = a.sampleRate*2, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; s.loop = true; f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = .7;
    g.gain.setValueAtTime(.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(.16, a.currentTime + .08);
    s.connect(f).connect(g).connect(a.destination); s.start(); hoseNode = {s, g};
  } else if (!on && hoseNode){ const {s, g} = hoseNode; hoseNode = null; g.gain.setTargetAtTime(.0001, a.currentTime, .04); s.stop(a.currentTime + .3); }
}
const SND = {
  click(){ tone({f:700,f2:480,type:'square',d:.06,v:.05}); },
  squish(){ noise({d:.08,v:.18,type:'lowpass',fq:700}); tone({f:500 + Math.random()*700,f2:900 + Math.random()*600,d:.06,v:.05}); },
  happy(){ [784,988,1175,1568].forEach((f,i) => tone({f,f2:f*1.12,type:'triangle',t:i*.08,d:.12,v:.1})); },
  giggle(){ [900,1200,950,1250].forEach((f,i) => tone({f,f2:f*.9,type:'sine',t:i*.07,d:.06,v:.06})); },
  squeak(){ tone({f:1300 + Math.random()*400,f2:1700,type:'triangle',d:.08,v:.05}); },
  chime(){ tone({f:[1318.5,1568,1760,2093][Math.random()*4|0],d:.35,v:.08}); },
  splat(){ noise({d:.18,v:.4,type:'lowpass',fq:500}); tone({f:120,f2:60,d:.15,v:.25}); },
  stage(){ [659.25,783.99,1046.5].forEach((f,i) => tone({f,type:'triangle',t:i*.09,d:.22,v:.15})); },
  horn(){ [0,.28].forEach(t => { tone({f:349,type:'square',t,d:.2,v:.07}); tone({f:440,type:'square',t,d:.2,v:.06}); }); },
  engine(){ const a = ac(); if (!a || !settings.sound) return; const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain(), now = a.currentTime;
    o.type = 'sawtooth'; o.frequency.setValueAtTime(55, now); o.frequency.exponentialRampToValueAtTime(140, now + 1.1);
    f.type = 'lowpass'; f.frequency.value = 500; g.gain.setValueAtTime(.0001, now); g.gain.exponentialRampToValueAtTime(.09, now + .1); g.gain.exponentialRampToValueAtTime(.0001, now + 1.3);
    o.connect(f).connect(g).connect(a.destination); o.start(now); o.stop(now + 1.4); },
  clean(){ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i) => { tone({f,type:'triangle',t:i*.09,d:.25,v:.16}); tone({f:f*2,t:i*.09,d:.15,v:.04}); }); },
  win(){ [523.25,659.25,783.99,1046.5].forEach((f,i) => { tone({f,type:'triangle',t:i*.13,d:.3,v:.2}); tone({f:f*2,t:i*.13,d:.22,v:.05}); });
    [523.25,659.25,783.99,1046.5].forEach(f => tone({f,type:'triangle',t:.62,d:1.3,v:.12})); }
};

let voiceBuf = null, voiceSrc = null;
function loadVoice(){ const a = ac(); if (!a || voiceBuf) return;
  try{ const bin = atob(VOICE_B64), u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); a.decodeAudioData(u.buffer, b => { voiceBuf = b; }, () => {}); }catch(e){} }
function sayWellDone(){ if (!settings.sound) return; const a = ac();
  if (a && voiceBuf){ try{ voiceSrc = a.createBufferSource(); voiceSrc.buffer = voiceBuf; voiceSrc.connect(a.destination); voiceSrc.start(); return; }catch(e){} }
  try{ const u = new SpeechSynthesisUtterance('Well done, Matthew Finn!'); u.pitch = 1.3; speechSynthesis.speak(u); }catch(e){} }
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
addEventListener('pointerdown', () => { ac(); loadVoice(); }, {capture:true});

const VW = 800, VH = 460, VS = 2;
function vcanvas(){ const c = document.createElement('canvas'); c.width = VW*VS; c.height = VH*VS; const x = c.getContext('2d'); x.scale(VS, VS); x.lineJoin = 'round'; x.lineCap = 'round'; return [c, x]; }
function shape(x, fill, build, lw = 7){ x.beginPath(); build(); x.fillStyle = fill; x.fill(); x.lineWidth = lw; x.strokeStyle = INK; x.stroke(); }
const rr = (x,a,b,w,h,r) => () => { if (x.roundRect) x.roundRect(a,b,w,h,r); else x.rect(a,b,w,h); };
const circle = (x,a,b,r) => () => x.arc(a,b,r,0,TAU);
function wheel(x, a, b, r, hub = '#C9CFDB'){ shape(x,'#2A2F3F',circle(x,a,b,r)); shape(x,hub,circle(x,a,b,r*.48),5); shape(x,'#8C95A8',circle(x,a,b,r*.16),4); }
function light(x, a, b, r, col){ shape(x,col,circle(x,a,b,r),5); x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.arc(a - r*.3, b - r*.3, r*.3, 0, TAU); x.fill(); }
function glass(x, build){ shape(x,'#9FE3FF',build,6); }

const MW = 200, MH = 115, mcan = document.createElement('canvas'); mcan.width = MW; mcan.height = MH;

function alphaOf(layer){ mctx.clearRect(0,0,MW,MH); mctx.drawImage(layer, 0, 0, MW, MH); return mctx.getImageData(0,0,MW,MH).data; }
function measure(){
  const st = S.stage, m = S.maskA; if (!m) return;
  const a = alphaOf(st === 0 ? L.foam : st === 1 ? L.mud : st === 2 ? L.wet : L.dull), b = st === 1 ? alphaOf(L.foam) : null;
  let rem = 0; const pts = [];
  for (let i=0, p=3; i<MW*MH; i++, p+=4){
    if (m[p] < 128) continue;
    const left = st === 0 ? a[p] < 110 : st === 1 ? (a[p] > 45 || b[p] > 45) : st === 2 ? a[p] > 45 : a[p] > 35;
    if (left){ rem++; if (rem % 7 === 1) pts.push({x:(i % MW)*VW/MW + 2, y:Math.floor(i/MW)*VH/MH + 2}); }
  }
  if (S.rem0 == null) S.rem0 = Math.max(1, rem);
  S.prog = Math.max(0, 1 - rem/S.rem0);
  const step = Math.max(1, Math.floor(pts.length/8)); S.left = pts.filter((_, k) => k % step === 0).slice(0, 10);
  const chip = document.querySelector('#steps .stepchip.now'); if (chip) chip.style.setProperty('--p', Math.round(S.prog*100) + '%');
  if (rem <= Math.max(3, S.maskN*.006)) stageDone();   // genuinely clean (only a few tiny specks), then tidy those
}

  erase('mud', lx, ly, 58); erase('foam', lx, ly, 62);
  const x = L.wet.getContext('2d');
  for (let i=0;i<3;i++){ const bx = lx + (Math.random()-.5)*90, by = ly + (Math.random()-.5)*70, r = 4 + Math.random()*7;
    x.fillStyle = 'rgba(120,200,255,.75)'; x.beginPath(); x.ellipse(bx, by, r*.8, r, 0, 0, TAU); x.fill();
    x.fillStyle = 'rgba(255,255,255,.95)'; x.beginPath(); x.arc(bx - r*.25, by - r*.35, r*.28, 0, TAU); x.fill(); }
  S.dirty.add('wet'); mark(1, lx, ly, 60); S.puddle = Math.min(1, S.puddle + .004);
}
function brushDry(lx, ly){ erase('wet', lx, ly, 70); mark(2, lx, ly, 64); }
function brushShine(lx, ly){ erase('dull', lx, ly, 66); if (Math.random() < .5) S.sparkles.push({x:lx, y:ly, ph:Math.random()*TAU, s:.6 + Math.random()*.7, heart: isAni() && Math.random() < .5}); mark(3, lx, ly, 60); }
function dullFilm(){ // a matt film over the vehicle so he can SEE what still needs shining
  const x = L.dull.getContext('2d'); x.clearRect(0,0,VW,VH); x.fillStyle = 'rgba(190,196,208,.62)'; x.fillRect(0,0,VW,VH);
  x.strokeStyle = 'rgba(150,158,172,.5)'; x.lineWidth = 6; for (let i=-VH;i<VW;i+=26){ x.beginPath(); x.moveTo(i,0); x.lineTo(i+VH,VH); x.stroke(); }
  maskLayer('dull');
}

function stageDone(){
  const i = S.stage;
  if (i === 0){ // lather the last specks so it really is all soapy
    const x = L.foam.getContext('2d'); x.fillStyle = 'rgba(248,251,255,.95)'; x.fillRect(0,0,VW,VH);
    S.cells.forEach((c, k) => { if (k % 2) return; const r = 8 + Math.random()*14; x.fillStyle = '#fff'; x.beginPath(); x.arc(c.x + (Math.random()-.5)*16, c.y + (Math.random()-.5)*16, r, 0, TAU); x.fill(); x.strokeStyle = 'rgba(150,200,255,.9)'; x.lineWidth = 2; x.stroke(); });
    maskLayer('foam'); }
  if (i === 1){ L.mud.getContext('2d').clearRect(0,0,VW,VH); L.foam.getContext('2d').clearRect(0,0,VW,VH);
    const x = L.wet.getContext('2d'); // soaking wet all over, so the towel has a job
    for (let n=0; n<Math.max(160, S.cells.length/3); n++){ const c = S.cells[Math.random()*S.cells.length|0], r = 4 + Math.random()*8, bx = c.x + (Math.random()-.5)*20, by = c.y + (Math.random()-.5)*20;
      x.fillStyle = 'rgba(120,200,255,.75)'; x.beginPath(); x.ellipse(bx, by, r*.8, r, 0, 0, TAU); x.fill();
      x.fillStyle = 'rgba(255,255,255,.95)'; x.beginPath(); x.arc(bx - r*.25, by - r*.35, r*.28, 0, TAU); x.fill(); }
    maskLayer('wet'); hose(false); }
  if (i === 2){ L.wet.getContext('2d').clearRect(0,0,VW,VH); dullFilm(); }
  if (i === 3){ finishVehicle(); return; }
  S.stage++; S.rem0 = null; S.prog = 0; S.left = []; S.measT = .15; SND.stage(); buzz(20); renderSteps(); renderTools();
  for (let n=0;n<14;n++) S.bubbles.push({x:VX + 400 + (Math.random()-.5)*600, y:VY + 250 + (Math.random()-.5)*200, r:8 + Math.random()*14, vy:-80 - Math.random()*80, vx:(Math.random()-.5)*60, life:1});
}
function finishVehicle(){
  L.dull.getContext('2d').clearRect(0,0,VW,VH);
  S.phase = 'gleam'; S.gleam = 0; SND.clean(); buzz([30,40,30]);
  S.washed++; store.set('cw-washed', S.washed); $('#washed').textContent = S.washed; S.round.push(S.veh);
  renderSteps(); renderTools();
  if (isAni()){ setTimeout(() => SND.happy(), 900); setTimeout(() => { S.phase = 'out'; }, 1500); }
  else { setTimeout(() => { SND.horn(); }, 900); setTimeout(() => { S.phase = 'out'; SND.engine(); }, 1500); }
}

/* ---------- UI bits ---------- */
function icon(st, i){ if (i === 3 && isAni()) return '🪮'; return st.icon === 'towel' ? TOWEL_SVG : st.icon; }
function label(st, i){ return i === 3 && isAni() ? 'Brush' : st.label; }
function renderSteps(){
  $('#steps').innerHTML = STAGES.map((st, i) => `<span class="stepchip ${i < S.stage || S.phase === 'gleam' || S.phase === 'out' ? 'done' : i === S.stage ? 'now' : ''}" aria-label="${st.label}">${st.icon === 'towel' ? '🧺' : st.icon}</span>`).join('');
  const now = $('#steps .stepchip.now'); if (now && now.textContent === '🧺') now.innerHTML = '<span style="width:24px;height:24px;display:block">' + TOWEL_SVG + '</span>';
  $('#steps').querySelectorAll('.stepchip').forEach((c, i) => { if (STAGES[i].icon === 'towel') c.innerHTML = '<span style="width:24px;height:24px;display:block">' + TOWEL_SVG + '</span>'; });
  if (isAni()){ const c = $('#steps').querySelectorAll('.stepchip')[3]; if (c) c.textContent = '🪮'; }
}
function renderTools(){
  const box = $('#tools'); box.innerHTML = '';
  STAGES.forEach((st, i) => { const b = document.createElement('button'); b.type = 'button';
    b.className = 'tool' + (i === S.stage && S.phase === 'wash' ? ' now' : i < S.stage ? ' done' : '');
    b.disabled = i !== S.stage; b.innerHTML = `${icon(st, i)}<small>${label(st, i)}</small>`; b.setAttribute('aria-label', label(st, i));
    box.appendChild(b); });
}
$('#washed').textContent = S.washed;

/* ---------- canvas + input ---------- */
const cv = $('#scene'), ctx = cv.getContext('2d'); let scale = 1;
function fit(){
  const box = $('#stageBox'), bw = box.clientWidth - 10, bh = box.clientHeight - 18;
  let w = bw, h = w*SH/SW; if (h > bh){ h = bh; w = h*SW/SH; }
  w = Math.max(160, Math.floor(w)); h = Math.floor(w*SH/SW);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = w + 'px'; cv.style.height = h + 'px'; cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); scale = cv.width / SW;
}
addEventListener('resize', fit); try{ new ResizeObserver(() => fit()).observe($('#stageBox')); }catch(e){}
function toScene(e){ const r = cv.getBoundingClientRect(); return [(e.clientX - r.left)*SW/r.width, (e.clientY - r.top)*SH/r.height]; }
function applyAt(sx, sy){
  if (S.phase !== 'wash') return;
  const lx = sx - VX, ly = sy - VY; S.idle = 0;
  [brushSoap, brushRinse, brushDry, brushShine][S.stage](lx, ly);
  const now = performance.now();
  if (now - S.sndT > [95, 999999, 140, 120][S.stage]){ S.sndT = now; [SND.squish, () => {}, SND.squeak, SND.chime][S.stage](); if (isAni() && Math.random() < .08) SND.giggle(); }
}
function stroke(sx, sy){
  if (!S.last){ applyAt(sx, sy); S.last = [sx, sy]; return; }
  const [ax, ay] = S.last, d = Math.hypot(sx - ax, sy - ay), n = Math.max(1, Math.ceil(d/14));
  for (let i=1;i<=n;i++) applyAt(ax + (sx - ax)*i/n, ay + (sy - ay)*i/n);
  S.last = [sx, sy];
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); const [x, y] = toScene(e); S.pointer = [x, y]; S.down = true; S.last = null;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){} if (S.phase === 'wash' && S.stage === 1) hose(true); stroke(x, y); });
cv.addEventListener('pointermove', e => { const [x, y] = toScene(e); S.pointer = [x, y]; if (S.down) stroke(x, y); });
const up = () => { S.down = false; S.last = null; hose(false); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', () => { if (!S.down) S.pointer = null; });
['touchstart','touchmove'].forEach(ev => cv.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, {passive:false}));

/* ---------- loop ---------- */
function update(dt){
  S.idle += dt;
  if (S.phase === 'wash'){ S.measT -= dt; if (S.measT <= 0){ S.measT = .2; measure(); } }
  if (S.phase === 'in'){ S.off += (0 - S.off)*Math.min(1, dt*3.2); if (Math.abs(S.off) < 2){ S.off = 0; S.phase = 'wash'; SND.splat(); renderTools(); } }
  if (S.phase === 'gleam'){ S.gleam += dt*1.2; }
  if (S.phase === 'out'){ S.off += (S.off + 60)*dt*3; if (S.off > 1300){
      if (S.round.length >= settings.party){ S.phase = 'party'; party(); } else nextVehicle(); } }
  S.bubbles.forEach(b => { b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt*.6; }); S.bubbles = S.bubbles.filter(b => b.life > 0);
  if (S.down && S.phase === 'wash' && S.stage === 1 && S.pointer){
    for (let i=0;i<4;i++) S.drops.push({x:S.pointer[0] - 70 + (Math.random()-.5)*10, y:S.pointer[1] - 95, vx:70*3.2 + (Math.random()-.5)*80, vy:95*3.2 + (Math.random()-.5)*80, life:.32}); }
  S.drops.forEach(d => { d.x += d.vx*dt; d.y += d.vy*dt; d.life -= dt; }); S.drops = S.drops.filter(d => d.life > 0);
  if (S.puddle > 0 && S.stage > 1) S.puddle = Math.max(0, S.puddle - dt*.02);
  for (const k of S.dirty) maskLayer(k); S.dirty.clear();
}
function drawLeftovers(time){ // pulsing rings on spots still to do
  const left = S.left || []; if (!left.length) return; const k = .5 + .5*Math.sin(time/220);
  ctx.save(); ctx.lineWidth = 5; ctx.strokeStyle = `rgba(255,210,63,${.5 + k*.5})`;
  left.forEach(c => { ctx.beginPath(); ctx.arc(c.x, c.y, 16 + k*10, 0, TAU); ctx.stroke(); });
  ctx.restore();
}
function star(x, cx, cy, r){ x.beginPath(); for (let i=0;i<8;i++){ const rr2 = i%2 ? r*.35 : r, t = -Math.PI/2 + i*Math.PI/4; x.lineTo(cx + Math.cos(t)*rr2, cy + Math.sin(t)*rr2); } x.closePath(); }
function drawTool(time){
  if (!S.pointer || S.phase !== 'wash') return;
  const [x, y] = S.pointer; ctx.save(); ctx.translate(x, y);
  if (S.stage === 0){ ctx.rotate(-.2 + (S.down ? Math.sin(time/60)*.15 : 0));
    ctx.fillStyle = '#FFD23F'; ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(-55,-35,110,70,22); else ctx.rect(-55,-35,110,70); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FF9F1C'; ctx.fillRect(-55,14,110,4); [[-30,-12,7],[0,-18,5],[24,-6,8],[-12,4,4],[36,-20,4]].forEach(([a,b,r]) => { ctx.fillStyle = '#E0A800'; ctx.beginPath(); ctx.arc(a,b,r,0,TAU); ctx.fill(); }); }
  if (S.stage === 1){ ctx.strokeStyle = INK; ctx.lineWidth = 22; ctx.beginPath(); ctx.moveTo(-70,-95); ctx.quadraticCurveTo(-200,-60,-260,120); ctx.stroke();
    ctx.strokeStyle = '#26B36B'; ctx.lineWidth = 14; ctx.beginPath(); ctx.moveTo(-70,-95); ctx.quadraticCurveTo(-200,-60,-260,120); ctx.stroke();
    ctx.save(); ctx.translate(-70,-95); ctx.rotate(Math.atan2(95,70));
    ctx.fillStyle = '#FFD23F'; ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(-10,-16,60,32,10); else ctx.rect(-10,-16,60,32); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8C95A8'; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(46,-11,22,22,5); else ctx.rect(46,-11,22,22); ctx.fill(); ctx.stroke(); ctx.restore();
    if (!S.down){ ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0,0,30,0,TAU); ctx.stroke(); } }
  if (S.stage === 2){ ctx.rotate(.15 + (S.down ? Math.sin(time/70)*.2 : 0));
    ctx.fillStyle = '#3A8DFF'; ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(-60,-45,120,90,16); else ctx.rect(-60,-45,120,90); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(-60,16,120,12); ctx.strokeRect(-60,16,120,12); }
  if (S.stage === 3 && isAni()){ ctx.rotate(-.3 + (S.down ? Math.sin(time/70)*.2 : 0));
    ctx.fillStyle = '#7B5CFF'; ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(-60,-30,120,26,10); else ctx.rect(-60,-30,120,26); ctx.fill(); ctx.stroke();
    for (let i=0;i<9;i++){ ctx.fillStyle = '#7B5CFF'; ctx.fillRect(-54 + i*13, -6, 7, 34); ctx.strokeRect(-54 + i*13, -6, 7, 34); }
    ctx.restore(); return; }
  if (S.stage === 3){ ctx.rotate(.5); ctx.strokeStyle = INK; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,80); ctx.stroke(); ctx.strokeStyle = '#7B5CFF'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,80); ctx.stroke();
    ctx.fillStyle = '#FFD23F'; ctx.strokeStyle = INK; ctx.lineWidth = 4; star(ctx, 0, -6, 30 + Math.sin(time/120)*3); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}
function draw(time){
  ctx.setTransform(scale,0,0,scale,0,0);
  // bay: tiled wall, sign, floor
  ctx.fillStyle = '#DDF4FF'; ctx.fillRect(0,0,SW,SH);
  ctx.strokeStyle = 'rgba(58,141,255,.18)'; ctx.lineWidth = 2; for (let x=0;x<SW;x+=50){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,560); ctx.stroke(); } for (let y=0;y<560;y+=50){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(SW,y); ctx.stroke(); }
  for (let i=0;i<10;i++){ ctx.fillStyle = i%2 ? '#fff' : '#3A8DFF'; ctx.fillRect(i*100, 0, 100, 26); }
  ctx.fillStyle = '#FFD23F'; ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(300,38,400,76,24); else ctx.rect(300,38,400,76); ctx.fill(); ctx.stroke();
  ctx.font = '800 50px "Baloo 2","Arial Rounded MT Bold",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 9;
  ctx.strokeText('Splash & Scrub', 500, 80); ctx.fillStyle = '#3A8DFF'; ctx.fillText('Splash & Scrub', 500, 80);
  [[140,80],[860,80]].forEach(([bx,by]) => [[0,0,22],[26,-10,14],[-22,-14,10],[14,18,9]].forEach(([dx,dy,r]) => { ctx.strokeStyle = '#7FD3FF'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(bx+dx, by+dy+Math.sin(time/500+dx)*4, r, 0, TAU); ctx.stroke(); }));
  ctx.fillStyle = '#8C95A8'; ctx.fillRect(0,560,SW,SH-560); ctx.fillStyle = '#6B7385'; for (let x=0;x<SW;x+=120) ctx.fillRect(x+40, 640, 60, 10);
  ctx.fillStyle = '#FFD23F'; ctx.fillRect(0,556,SW,10);
  if (S.puddle > 0){ ctx.fillStyle = `rgba(120,200,255,${S.puddle*.6})`; ctx.beginPath(); ctx.ellipse(500,610,380,34,0,0,TAU); ctx.fill(); }
  ctx.fillStyle = '#2A2F3F'; ctx.beginPath(); ctx.ellipse(500,650,60,12,0,0,TAU); ctx.fill();

  if (S.veh){
    const moving = S.phase === 'in' || S.phase === 'out', hop = isAni() && moving ? -Math.abs(Math.sin(time/130))*38 : isAni() && S.phase === 'gleam' ? -Math.abs(Math.sin(time/110))*22 : 0;
    ctx.save(); ctx.translate(VX + S.off, VY + hop + (moving && !isAni() ? Math.sin(time/60)*2 : 0));
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(400,440,360,20,0,0,TAU); ctx.fill();
    ctx.drawImage(S.veh.sprite, 0, 0, VW, VH);
    ctx.drawImage(L.mud, 0, 0); ctx.drawImage(L.foam, 0, 0); ctx.drawImage(L.wet, 0, 0); ctx.drawImage(L.dull, 0, 0);
    if (S.phase === 'wash' && !S.down && S.idle > 1.4 && S.prog > .3) drawLeftovers(time);
    S.sparkles.forEach(s => { const k = .6 + .4*Math.sin(time/180 + s.ph);
      if (s.heart){ const r = 12*s.s*k; ctx.fillStyle = '#FF7AB6'; ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(s.x, s.y + r); ctx.bezierCurveTo(s.x - r*1.6, s.y - r*.2, s.x - r*.6, s.y - r*1.4, s.x, s.y - r*.4); ctx.bezierCurveTo(s.x + r*.6, s.y - r*1.4, s.x + r*1.6, s.y - r*.2, s.x, s.y + r); ctx.fill(); ctx.stroke(); return; }
      ctx.fillStyle = '#FFF6B0'; ctx.strokeStyle = '#FFB627'; ctx.lineWidth = 2; star(ctx, s.x, s.y, 14*s.s*k); ctx.fill(); ctx.stroke(); });
    if (S.gleam >= 0 && S.gleam < 1.4){ // shiny sweep across the clean vehicle
      const g = document.createElement('canvas'); g.width = VW; g.height = VH; const gx = g.getContext('2d'), p = -300 + S.gleam*1000;
      const lg = gx.createLinearGradient(p, 0, p + 200, 120); lg.addColorStop(0,'rgba(255,255,255,0)'); lg.addColorStop(.5,'rgba(255,255,255,.85)'); lg.addColorStop(1,'rgba(255,255,255,0)');
      gx.fillStyle = lg; gx.fillRect(0,0,VW,VH); gx.globalCompositeOperation = 'destination-in'; gx.drawImage(L.mask,0,0); ctx.drawImage(g, 0, 0); }
    ctx.restore();
  }
  S.bubbles.forEach(b => { ctx.globalAlpha = Math.max(0, b.life); ctx.strokeStyle = '#7FD3FF'; ctx.lineWidth = 3; ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke(); });
  ctx.globalAlpha = 1;
  S.drops.forEach(d => { ctx.fillStyle = 'rgba(80,170,255,.85)'; ctx.beginPath(); ctx.arc(d.x, d.y, 5, 0, TAU); ctx.fill(); });
  if (S.phase === 'gleam' || S.phase === 'out'){
    ctx.font = '800 72px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 12; ctx.strokeStyle = INK; ctx.strokeText('Sparkly clean!', 500, 190); ctx.fillStyle = '#26B36B'; ctx.fillText('Sparkly clean!', 500, 190); }
  if (S.phase === 'wash' && S.idle > 5 && !S.down){ // nudge: show where to rub
    const pool = S.left && S.left.length ? S.left : S.cells, c = pool[Math.floor(time/1600) % Math.max(1, pool.length)] || {x:400,y:200};
    ctx.font = '64px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('👆', VX + c.x + Math.sin(time/180)*20, VY + c.y + 40); }
  drawTool(time);
}
let last = performance.now();
function loop(now){ const dt = Math.min(.05, (now - last)/1000); last = now; update(dt); draw(now); requestAnimationFrame(loop); }

/* ---------- settings + party ---------- */
function markOpts(){ document.querySelectorAll('.party').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === settings.party ? 'true' : 'false')); }
document.querySelectorAll('.party').forEach(b => b.addEventListener('click', () => { settings.party = +b.dataset.n; store.set('cw-party', settings.party); markOpts(); SND.click(); }));
$('#setBtn').addEventListener('click', () => { markOpts(); $('#settings').hidden = false; SND.click(); });
$('#doneBtn').addEventListener('click', () => { $('#settings').hidden = true; SND.click(); });
$('#soundBtn').addEventListener('click', e => { settings.sound = !settings.sound; e.currentTarget.setAttribute('aria-pressed', settings.sound); e.currentTarget.textContent = settings.sound ? '🔊' : '🔇'; if (!settings.sound) hose(false); SND.click(); });
let confRAF = 0;
function party(){
  const haul = $('#haul'); haul.innerHTML = '';
  S.round.forEach((v, i) => { const im = new Image(); im.src = thumbOf(v); im.alt = ''; im.style.setProperty('--d', (i*.1) + 's'); haul.appendChild(im); });
  $('#win').hidden = false; SND.win(); buzz([40,60,40,60,80]); setTimeout(sayWellDone, 1300); startConfetti();
}
$('#againBtn').addEventListener('click', () => { cancelAnimationFrame(confRAF); try{ voiceSrc && voiceSrc.stop(); }catch(e){} $('#win').hidden = true; S.round = []; SND.click(); nextVehicle(); });
function startConfetti(){
  const c = $('#confetti'), x = c.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2), Wd = innerWidth, Hd = innerHeight;
  c.width = Wd*dpr; c.height = Hd*dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, colors = [...COLS, '#FFFFFF'], parts = [], t0 = performance.now();
  const add = n => { for (let i=0;i<n;i++) parts.push({x:Math.random()*Wd, y:-20 - Math.random()*Hd*.4, w:8+Math.random()*9, h:10+Math.random()*12, vy:2+Math.random()*3.5, vx:(Math.random()-.5)*2, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:colors[(Math.random()*colors.length)|0], ph:Math.random()*6}); };
  add(reduce ? 40 : 170);
  const step = t => { x.clearRect(0,0,Wd,Hd); if (!reduce && t - t0 < 4000) add(3);
    for (const p of parts){ p.y += p.vy; p.x += p.vx + Math.sin(t/350 + p.ph)*.9; p.r += p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); }
    for (let i=parts.length-1;i>=0;i--) if (parts[i].y > Hd + 30) parts.splice(i,1);
    if (parts.length) confRAF = requestAnimationFrame(step); else x.clearRect(0,0,Wd,Hd); };
  cancelAnimationFrame(confRAF); confRAF = requestAnimationFrame(step);
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { if (S.tab === t.dataset.t) return; if (S.phase === 'out' || S.phase === 'in') return; S.tab = t.dataset.t; SND.click(); nextVehicle(); }));
fit(); bringIn(fleet[0]); loadMine();
requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>

if ('serviceWorker' in navigator){ addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
